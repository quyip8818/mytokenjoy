# 生产环境 Docker Compose
# 部署到 ECS: /opt/tokenjoy/docker-compose.prod.yml
# 用法: docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ─── 基础设施 ───────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: tokenjoy
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PG_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    <<: [*restart, *logging]
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── NewAPI ─────────────────────────────────────────────────
  newapi-apps:
    image: ${ACR_REGISTRY}/tokenjoy-newapi:${IMAGE_TAG:-latest}
    <<: [*restart, *logging]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      SQL_DSN: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/newapi?sslmode=disable
      LOG_SQL_DSN: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/logs?sslmode=disable&search_path=newapi
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD}@redis:6379/0
      SESSION_SECRET: ${NEWAPI_SESSION_SECRET}
      SYNC_FREQUENCY: 60
      MANAGEMENT_WEBHOOK_URL: http://apps-backend:8010/api/internal/webhooks/newapi-log
      MANAGEMENT_WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    deploy:
      resources:
        limits:
          memory: 512M



  # ─── Apps 后端 ──────────────────────────────────────────────
  apps-backend:
    image: ${ACR_REGISTRY}/tokenjoy-apps-backend:${IMAGE_TAG:-latest}
    <<: [*restart, *logging]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      newapi-apps: { condition: service_started }
    environment:
      PORT: '8010'
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/tokenjoy?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      SESSION_SECRET: ${SESSION_SECRET}
      DEPLOY_ENV: production
      SUPPORT_SAAS: ${SUPPORT_SAAS:-false}
      NEWAPI_BASE_URL: http://newapi-apps:3000
      NEWAPI_ADMIN_TOKEN: ${NEWAPI_ADMIN_TOKEN}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── SMS 后端 ──────────────────────────────────────────────
  sms-backend:
    image: ${ACR_REGISTRY}/tokenjoy-sms-backend:${IMAGE_TAG:-latest}
    <<: [*restart, *logging]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PORT: '8020'
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/sms?sslmode=disable
      SESSION_SECRET: ${SMS_SESSION_SECRET}
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── 前端 ──────────────────────────────────────────────────
  apps-frontend:
    image: ${ACR_REGISTRY}/tokenjoy-apps-frontend:${IMAGE_TAG:-latest}
    <<: [*restart, *logging]
    depends_on: [apps-backend]
    deploy:
      resources:
        limits:
          memory: 64M

  sms-frontend:
    image: ${ACR_REGISTRY}/tokenjoy-sms-frontend:${IMAGE_TAG:-latest}
    <<: [*restart, *logging]
    depends_on: [sms-backend]
    deploy:
      resources:
        limits:
          memory: 64M

  web:
    image: ${ACR_REGISTRY}/tokenjoy-web:${IMAGE_TAG:-latest}
    <<: [*restart, *logging]
    deploy:
      resources:
        limits:
          memory: 64M

  # ─── 入口网关 ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    <<: [*restart, *logging]
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - apps-frontend
      - sms-frontend
      - web
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  pg_data:
  redis_data:
