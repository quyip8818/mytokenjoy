# 生产环境 — 全容器化
# 用法: docker compose --env-file env/secret.env --env-file env/apps.env up -d
services:
  # ─── 基础设施 ───────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    command: ['postgres', '-c', 'max_connections=200', '-c', 'max_locks_per_transaction=1024']
    environment:
      POSTGRES_USER: tokenjoy
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: tokenjoy
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tokenjoy']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  newapi:
    build:
      context: ../apps/newapi
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      SQL_DSN: postgresql://tokenjoy:${PG_PASSWORD}@postgres:5432/newapi?sslmode=disable
      LOG_SQL_DSN: postgresql://tokenjoy:${PG_PASSWORD}@postgres:5432/logs?sslmode=disable&search_path=newapi
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD}@redis:6379/0
      SESSION_SECRET: ${NEWAPI_SESSION_SECRET}
      SYNC_FREQUENCY: 60
      MANAGEMENT_WEBHOOK_URL: http://apps-backend:8010/api/internal/webhooks/newapi-log
      MANAGEMENT_WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    logging: *logging

  # ─── Apps ───────────────────────────────────────────────────
  apps-backend:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/apps-backend.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      newapi: { condition: service_started }
    env_file:
      - env/secret.env
      - env/.secret.env
      - env/apps.env
    environment:
      DATABASE_URL: postgres://tokenjoy:${PG_PASSWORD}@postgres:5432/tokenjoy?sslmode=disable
      LOG_DATABASE_URL: postgres://tokenjoy:${PG_PASSWORD}@postgres:5432/logs?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      NEW_API_BASE_URL: http://newapi:3000
      NEW_API_WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      PORT: '8010'
    logging: *logging

  apps-frontend:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/apps-frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      apps-backend: { condition: service_healthy }
    logging: *logging

  sms-backend:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/sms-backend.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    env_file:
      - env/secret.env
      - env/sms.env
    environment:
      DATABASE_URL: postgres://tokenjoy:${PG_PASSWORD}@postgres:5432/sms?sslmode=disable
      PORT: '8020'
    logging: *logging

  sms-frontend:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/sms-frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      sms-backend: { condition: service_healthy }
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/web.Dockerfile
    restart: unless-stopped
    logging: *logging

  # ─── 入口网关 ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - apps-frontend
      - sms-frontend
      - web
    logging: *logging

volumes:
  pg_data:
  redis_data:
