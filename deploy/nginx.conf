# 入口网关: SSL 终止 + 域名路由
# 挂载到 nginx 容器 /etc/nginx/nginx.conf

worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # 共用证书（Let's Encrypt SAN 证书覆盖所有域名）
    ssl_certificate     /etc/letsencrypt/live/tokenjoy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tokenjoy/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ─── app ─────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name app.tokenjoy.me;

        client_max_body_size 10m;

        # 官网 iframe 嵌入的认证入口——允许跨子域嵌入
        location /embed.html {
            proxy_pass http://apps-frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 用 CSP frame-ancestors 替代 X-Frame-Options
            proxy_hide_header X-Frame-Options;
            add_header Content-Security-Policy "frame-ancestors https://www.tokenjoy.me https://tokenjoy.me" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        location / {
            proxy_pass http://apps-frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }

    # ─── sms ─────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name sms.tokenjoy.me;

        client_max_body_size 10m;

        location / {
            proxy_pass http://sms-frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ─── www ─────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name www.tokenjoy.me;

        location / {
            proxy_pass http://web:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ─── 裸域名 → www ───────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name tokenjoy.me;
        return 301 https://www.tokenjoy.me$request_uri;
    }

    # ─── HTTP → HTTPS ────────────────────────────────────────
    server {
        listen 80;
        server_name app.tokenjoy.me sms.tokenjoy.me www.tokenjoy.me tokenjoy.me;
        return 301 https://$host$request_uri;
    }
}
