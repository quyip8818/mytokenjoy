name: Build & Deploy

on:
  push:
    branches: [main]

env:
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com/tokenjoy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login "$ACR_REGISTRY" -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build & push apps-frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/dockerfiles/apps-frontend.Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/tokenjoy-apps-frontend:${{ steps.meta.outputs.tag }}
            ${{ env.ACR_REGISTRY }}/tokenjoy-apps-frontend:latest
          cache-from: type=gha,scope=apps-frontend
          cache-to: type=gha,mode=max,scope=apps-frontend

      - name: Build & push apps-backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/dockerfiles/apps-backend.Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/tokenjoy-apps-backend:${{ steps.meta.outputs.tag }}
            ${{ env.ACR_REGISTRY }}/tokenjoy-apps-backend:latest
          cache-from: type=gha,scope=apps-backend
          cache-to: type=gha,mode=max,scope=apps-backend

      - name: Build & push newapi
        uses: docker/build-push-action@v6
        with:
          context: apps/newapi
          file: apps/newapi/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/tokenjoy-newapi:${{ steps.meta.outputs.tag }}
            ${{ env.ACR_REGISTRY }}/tokenjoy-newapi:latest
          cache-from: type=gha,scope=newapi
          cache-to: type=gha,mode=max,scope=newapi

      - name: Build & push sms-frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/dockerfiles/sms-frontend.Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/tokenjoy-sms-frontend:${{ steps.meta.outputs.tag }}
            ${{ env.ACR_REGISTRY }}/tokenjoy-sms-frontend:latest
          cache-from: type=gha,scope=sms-frontend
          cache-to: type=gha,mode=max,scope=sms-frontend

      - name: Build & push sms-backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/dockerfiles/sms-backend.Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/tokenjoy-sms-backend:${{ steps.meta.outputs.tag }}
            ${{ env.ACR_REGISTRY }}/tokenjoy-sms-backend:latest
          cache-from: type=gha,scope=sms-backend
          cache-to: type=gha,mode=max,scope=sms-backend

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/dockerfiles/web.Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/tokenjoy-web:${{ steps.meta.outputs.tag }}
            ${{ env.ACR_REGISTRY }}/tokenjoy-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to ECS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/tokenjoy
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}/" .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
